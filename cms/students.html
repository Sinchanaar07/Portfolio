<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Students | Student Management System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fc;
        }

        .table thead {
            background-color: #4e73df;
            color: white;
        }

        .table tbody tr:hover {
            background-color: #f1f3f8;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Student List</h3>
            <button class="btn btn-primary" onclick="openAddModal()">
                <i class="bi bi-plus-lg"></i> Add Student
            </button>
        </div>

        <!-- Table -->
        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-bordered align-middle" id="studentTable">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Course</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Arjun Kumar</td>
                            <td>arjun@gmail.com</td>
                            <td>20</td>
                            <td>BCA</td>
                            <td class="text-center">
                                <button class="btn btn-warning btn-sm me-2" onclick="editStudent(this)">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteStudent(this)">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>
        </div>

    </div>

    <!-- ADD / EDIT MODAL -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="studentForm">
                        <div class="mb-3">
                            <label>Student Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label>Age</label>
                            <input type="number" class="form-control" id="age" required>
                        </div>

                        <div class="mb-3">
                            <label>Course</label>
                            <input type="text" class="form-control" id="course" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Save Student
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script>
        let selectedRow = null;
        let modal = new bootstrap.Modal(document.getElementById("studentModal"));

        function openAddModal() {
            selectedRow = null;
            document.getElementById("modalTitle").innerText = "Add Student";
            document.getElementById("studentForm").reset();
            modal.show();
        }

        document.getElementById("studentForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let age = document.getElementById("age").value;
            let course = document.getElementById("course").value;

            let tableBody = document.querySelector("#studentTable tbody");

            if (selectedRow === null) {
                // ADD NEW STUDENT
                let newRow = tableBody.insertRow();
                newRow.innerHTML = `
                <td>${name}</td>
                <td>${email}</td>
                <td>${age}</td>
                <td>${course}</td>
                <td class="text-center">
                    <button class="btn btn-warning btn-sm me-2"
                            onclick="editStudent(this)">
                        <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-danger btn-sm"
                            onclick="deleteStudent(this)">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            } else {
                // UPDATE STUDENT
                selectedRow.cells[0].innerText = name;
                selectedRow.cells[1].innerText = email;
                selectedRow.cells[2].innerText = age;
                selectedRow.cells[3].innerText = course;
            }

            modal.hide();
        });

        function editStudent(button) {
            selectedRow = button.closest("tr");
            document.getElementById("modalTitle").innerText = "Edit Student";

            document.getElementById("name").value = selectedRow.cells[0].innerText;
            document.getElementById("email").value = selectedRow.cells[1].innerText;
            document.getElementById("age").value = selectedRow.cells[2].innerText;
            document.getElementById("course").value = selectedRow.cells[3].innerText;

            modal.show();
        }

        function deleteStudent(button) {
            if (confirm("Are you sure you want to delete this student?")) {
                button.closest("tr").remove();
            }
        }
    </script>

</body>

</html>
