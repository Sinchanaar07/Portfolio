<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            animation: fadeIn 1s ease-in;
        }

        header {
            background: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        header a {
            color: #ff9800;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .skill-section {
            background: white;
            padding: 25px;
            margin-bottom: 30px;
            border-left: 5px solid #ff9800;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: slideUp 1s ease;
        }

        .skill-section h3 {
            margin-bottom: 15px;
            color: #222;
        }

        .skill-section ul {
            list-style-type: square;
            padding-left: 20px;
        }

        .skill-section li {
            margin: 8px 0;
            font-size: 16px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 10px;
        }

        footer a {
            color: #ff9800;
            text-decoration: none;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Skills</h1>
        <a href="../index.html">← Back to Home</a>
    </header>

    <main>
        <h2>Skills Overview</h2>

        <!-- Hard Skills -->
        <div class="skill-section">
            <h3>Hard Skills (Technical Skills)</h3>
            <ul>
                <li>HTML5</li>
                <li>CSS3</li>
                <li>PHP</li>
                <li>MySQL</li>
                <li>C Programming</li>
                <li>Basic Python</li>
            </ul>
        </div>

        <!-- Soft Skills -->
        <div class="skill-section">
            <h3>Soft Skills</h3>
            <ul>
                <li>Good Communication Skills</li>
                <li>Team Work</li>
                <li>Problem Solving</li>
                <li>Time Management</li>
            </ul>
        </div>
    </main>

    <footer>
        <p>© 2026 Vinaya Kurdekar | <a href="mailto:vinayashetvinayashet@gmail.com">Contact Me</a></p>
    </footer>

</body>

</html>
