<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinchana AR | Portfolio</title>
    <meta name="description" content="Personal portfolio of Kavya BK">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            animation: fadeIn 1.5s ease-in;
        }

        header {
            background: #222;
            color: white;
            padding: 15px;
            animation: slideDown 1s ease-out;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0;
            margin: 0;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            position: relative;
        }

        nav ul li a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            background: #ff9800;
            left: 0;
            bottom: -5px;
            transition: width 0.4s ease;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 60px 20px;
            text-align: center;
        }

        .intro {
            background: white;
            padding: 40px;
            border-left: 5px solid #ff9800;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: slideUp 1.2s ease;
        }

        .intro h2 {
            margin-top: 0;
            animation: bounce 1.2s;
        }

        .intro p {
            font-size: 18px;
            line-height: 1.6;
        }

        .quick-links a {
            display: inline-block;
            margin: 15px 10px 0;
            padding: 10px 20px;
            background: #ff9800;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .quick-links a:hover {
            background: #e68900;
        }

        /* Social Media Section */
        .social-section {
            background: white;
            padding: 30px;
            margin-top: 40px;
            border-left: 5px solid #ff9800;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .social-section h3 {
            margin-bottom: 20px;
        }

        .social-buttons a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        .github {
            background: #333;
        }

        .linkedin {
            background: #0077b5;
        }

        .instagram {
            background: #e4405f;
        }

        .social-buttons a:hover {
            opacity: 0.8;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 12px;
            animation: fadeIn 2s;
        }

        footer a {
            color: #ff9800;
            text-decoration: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-8px);
            }

            60% {
                transform: translateY(4px);
            }

            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <h1>Welcome To My Portfolio</h1>
            <ul>
                <li><a href="pages/about.html">About</a></li>
                <li><a href="pages/skill.html">Skills</a></li>
                <li><a href="pages/project.html">Projects</a></li>
                <li><a href="pages/education.html">Education</a></li>
                <li><a href="mailto:vinayashetvinayashet@gmail.com">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="intro">
            <h2>Hello 👋</h2>
            <p>
                I’m <strong>Sinchana </strong>
            </p>

            <div class="quick-links">
                <a href="pages/about.html">About Me</a>
                <a href="pages/project.html">View Projects</a>
            </div>
        </div>

        <!-- Social Media Section -->
        <div class="social-section">
            <h3>Social Media Accounts</h3>
            <div class="social-buttons">
                <a href="https://github.com/" class="github" target="_blank">GitHub</a>
                <a href="https://linkedin.com/" class="linkedin" target="_blank">LinkedIn</a>
                <a href="https://instagram.com/" class="instagram" target="_blank">Instagram</a>
            </div>
        </div>

    </main>

    <footer>
        <p>© 2026 Sinchana AR | <a href="mailto:shreyashreyaar@gmail.com">Contact</a></p>
    </footer>

</body>

</html>
